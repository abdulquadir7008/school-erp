# Render Blueprint — SchoolSphere ERP API (free tier)
# 1. Push this repo to GitHub
# 2. Render Dashboard → New → Blueprint → select this repo
# 3. Fill DATABASE_URL (Neon/Supabase Postgres) and CORS_ORIGIN (your Vercel URL)
#    when prompted, then Apply.
services:
  - type: web
    name: schoolsphere-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate --schema=prisma/schema.prisma && npm run build --workspace=apps/api
    startCommand: npx prisma db push --schema=prisma/schema.prisma && node apps/api/dist/index.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: REDIS_ENABLED
        value: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
